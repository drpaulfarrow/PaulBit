version: '3.8'

services:
  # NOTE: Using Azure Database for PostgreSQL (Managed Service)
  # No containerized postgres needed - connecting to monetizeplus-db.postgres.database.azure.com
  # Data persists across deployments with automatic backups

  # Licensing API - authentication, tokens, metering, policies
  licensing-api:
    image: paulandrewfarrow/monetizeplus-licensing-api:azure-20251113
    depends_on:
      - urlparser
    environment:
      # Azure App Service automatically injects app settings as environment variables
      # DATABASE_URL, JWT_SECRET, NODE_ENV are set via Azure App Settings
      REDIS_ENABLED: "false"
      URL_PARSER_URL: http://urlparser:4000
      JWT_ISSUER: monetizeplus
      JWT_AUDIENCE: monetizeplus-edge
      PORT: "3000"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "3000:3000"
    restart: unless-stopped

  # URL-to-Markdown Parser
  urlparser:
    image: paulandrewfarrow/monetizeplus-url-parser:latest
    environment:
      PORT: "4000"
    ports:
      - "4000:4000"
    restart: unless-stopped

  # Documentation Site (publicly accessible)
  docs-site:
    image: paulandrewfarrow/monetizeplus-docs-site:latest
    restart: unless-stopped

  # Publisher Dashboard
  publisher-dashboard:
    image: paulandrewfarrow/monetizeplus-publisher-dashboard:azure-20251112
    depends_on:
      - licensing-api
      - urlparser
      - docs-site
    ports:
      - "80:80"
    environment:
      LICENSING_API_URL: http://licensing-api:3000
      URL_PARSER_URL: http://urlparser:4000
    restart: unless-stopped
