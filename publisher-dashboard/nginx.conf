server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cache-busting for JS/CSS assets
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Return 404 for root path
    location = / {
        return 404;
    }

    # Serve app under /demo
    location /demo/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /demo/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Handle /demo without trailing slash - redirect to /demo/
    location = /demo {
        return 301 /demo/;
    }

    # API proxy to avoid CORS issues
    # Note: More specific routes must come BEFORE the generic /api/ route
    # Negotiations endpoint - handle without trailing slash to avoid redirect
    location /api/negotiations {
        proxy_pass http://licensing-api:3000/api/negotiations;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://licensing-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Grounding endpoint proxy (UI calls /api/grounding, but API route is /grounding)
    location /api/grounding {
        proxy_pass http://licensing-api:3000/grounding;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        proxy_method POST;
        proxy_cache_bypass $http_upgrade;
    }

    # Also handle direct /grounding requests
    location /grounding {
        proxy_pass http://licensing-api:3000/grounding;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Usage endpoint proxy
    location /usage {
        proxy_pass http://licensing-api:3000/usage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Policies endpoint proxy
    location /policies/ {
        proxy_pass http://licensing-api:3000/policies/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Parsed URLs endpoint proxy  
    location /parsed-urls {
        proxy_pass http://licensing-api:3000/parsed-urls;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth endpoints proxy
    location /auth/ {
        proxy_pass http://licensing-api:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin endpoints proxy
    location /admin/ {
        proxy_pass http://licensing-api:3000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Domain crawler endpoint proxy
    location /domain-crawler {
        proxy_pass http://licensing-api:3000/domain-crawler;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Parser service proxy (for local dev)
    location /parser/ {
        proxy_pass http://url-parser:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 20s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }

}
