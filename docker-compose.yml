services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monetizeplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monetizeplus123}
      POSTGRES_DB: ${POSTGRES_DB:-monetizeplus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monetizeplus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  licensing-api:
    build:
      context: ./licensing-api
      dockerfile: Dockerfile
    image: paulandrewfarrow/monetizeplus-licensing-api:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      url-parser:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${LIC_API_PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-monetizeplus}:${POSTGRES_PASSWORD:-monetizeplus123}@postgres:5432/${POSTGRES_DB:-monetizeplus}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      URL_PARSER_URL: http://url-parser:${URL_PARSER_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-in-production}
      JWT_ISSUER: ${JWT_ISSUER:-monetizeplus}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-monetizeplus-edge}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "${LIC_API_PORT:-3000}:${LIC_API_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${LIC_API_PORT:-3000}/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  url-parser:
    build:
      context: ./Simple Parser/url-to-markdown
      dockerfile: Dockerfile
    image: paulandrewfarrow/monetizeplus-url-parser:latest
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${URL_PARSER_PORT:-4000}
    ports:
      - "${URL_PARSER_PORT:-4000}:${URL_PARSER_PORT:-4000}"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${URL_PARSER_PORT:-4000}/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  edge-worker:
    image: paulandrewfarrow/monetizeplus-edge-worker:latest
    depends_on:
      - publisher-a
      - publisher-b
      - licensing-api
      - redis
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LICENSING_API_URL: http://licensing-api:${LIC_API_PORT:-3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PUBLISHER_A_URL: http://publisher-a:8081
      PUBLISHER_B_URL: http://publisher-b:8082
    ports:
      - "${EDGE_PORT:-3001}:${EDGE_PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${EDGE_PORT:-3001}/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  negotiation-agent:
    build:
      context: ./negotiation-agent
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
      - licensing-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${NEGOTIATION_PORT:-3003}
      DATABASE_URL: postgres://${POSTGRES_USER:-monetizeplus}:${POSTGRES_PASSWORD:-monetizeplus123}@postgres:5432/${POSTGRES_DB:-monetizeplus}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LICENSING_API_URL: http://licensing-api:${LIC_API_PORT:-3000}
    ports:
      - "${NEGOTIATION_PORT:-3003}:${NEGOTIATION_PORT:-3003}"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${NEGOTIATION_PORT:-3003}/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  docs-site:
    build:
      context: .
      dockerfile: docs-site/Dockerfile.docs
    image: paulandrewfarrow/monetizeplus-docs-site:latest
    restart: always

  publisher-dashboard:
    build:
      context: ./publisher-dashboard
      dockerfile: Dockerfile
      args:
        NGINX_CONFIG: nginx.conf
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    image: paulandrewfarrow/monetizeplus-publisher-dashboard:latest
    depends_on:
      - licensing-api
      - edge-worker
      - docs-site
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_URL: http://licensing-api:${LIC_API_PORT:-3000}
      EDGE_URL: http://edge-worker:${EDGE_PORT:-3001}
    ports:
      - "${DASHBOARD_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/demo/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  publisher-a:
    build:
      context: ./publisher-a
      dockerfile: Dockerfile
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  publisher-b:
    build:
      context: ./publisher-b
      dockerfile: Dockerfile
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
